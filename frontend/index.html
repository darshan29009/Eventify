<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Eventify - Complete Event Management System for Booking, Planning, and Managing Events" />
    <meta name="keywords" content="event management, wedding, corporate, birthday, party, event booking" />
    <meta name="author" content="Eventify" />
    <title>Eventify - Event Management System</title>

    <!-- Preconnect for external fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS (local) -->
    <link href="/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <style>
      /* ==========================================
         CSS RESET & GLOBAL STYLES
         ========================================== */
      :root {
        /* Color Palette */
        --primary-50: #eff6ff;
        --primary-100: #dbeafe;
        --primary-200: #bfdbfe;
        --primary-300: #93c5fd;
        --primary-400: #60a5fa;
        --primary-500: #3b82f6;
        --primary-600: #2563eb;
        --primary-700: #1d4ed8;
        --primary-800: #1e40af;
        --primary-900: #1e3a8a;

        /* Brand Colors */
        --primary-color: #667eea;
        --primary-dark: #5a67d8;
        --primary-light: #7c8ff9;
        --secondary-color: #764ba2;
        --accent-color: #f6ad55;
        --success-color: #10b981;
        --success-light: #d1fae5;
        --warning-color: #f59e0b;
        --warning-light: #fef3c7;
        --danger-color: #ef4444;
        --danger-light: #fee2e2;
        --info-color: #3b82f6;

        /* Neutral Colors */
        --gray-50: #f9fafb;
        --gray-100: #f3f4f6;
        --gray-200: #e5e7eb;
        --gray-300: #d1d5db;
        --gray-400: #9ca3af;
        --gray-500: #6b7280;
        --gray-600: #4b5563;
        --gray-700: #374151;
        --gray-800: #1f2937;
        --gray-900: #111827;

        /* Gradients */
        --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        --success-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
        --warning-gradient: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);

        /* Shadows */
        --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);

        /* Border Radius */
        --radius-sm: 0.375rem;
        --radius: 0.5rem;
        --radius-md: 0.75rem;
        --radius-lg: 1rem;
        --radius-xl: 1.5rem;
        --radius-full: 9999px;

        /* Spacing */
        --space-xs: 0.25rem;
        --space-sm: 0.5rem;
        --space: 1rem;
        --space-md: 1.5rem;
        --space-lg: 2rem;
        --space-xl: 3rem;
        --space-2xl: 4rem;

        /* Typography */
        --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        --font-heading: 'Poppins', var(--font-sans);

        /* Transitions */
        --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
        --transition-base: 250ms cubic-bezier(0.4, 0, 0.2, 1);
        --transition-slow: 350ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* Dark Mode Support */
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg-primary: #0a0a0a;
          --bg-secondary: #1a1a1a;
          --bg-tertiary: #262626;
          --text-primary: #f5f5f5;
          --text-secondary: #a0aec0;
          --border-color: #2d3748;
        }
      }

      [data-theme="dark"] {
        --bg-primary: #0a0a0a;
        --bg-secondary: #1a1a1a;
        --bg-tertiary: #262626;
        --text-primary: #f5f5f5;
        --text-secondary: #a0aec0;
        --border-color: #2d3748;
      }

      [data-theme="light"] {
        --bg-primary: #ffffff;
        --bg-secondary: #f8f9fa;
        --bg-tertiary: #ffffff;
        --text-primary: #1f2937;
        --text-secondary: #6b7280;
        --border-color: #e5e7eb;
      }

      /* ==========================================
         BASE STYLES
         ========================================== */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        font-family: var(--font-sans);
        background-color: var(--bg-secondary);
        color: var(--text-primary);
        line-height: 1.6;
        min-height: 100vh;
        transition: background-color var(--transition-base), color var(--transition-base);
      }

      /* Typography Scale */
      h1, h2, h3, h4, h5, h6,
      .h1, .h2, .h3, .h4, .h5, .h6 {
        font-family: var(--font-heading);
        font-weight: 600;
        line-height: 1.3;
        color: var(--text-primary);
        margin-bottom: var(--space);
      }

      h1 { font-size: 2.5rem; }
      h2 { font-size: 2rem; }
      h3 { font-size: 1.75rem; }
      h4 { font-size: 1.5rem; }
      h5 { font-size: 1.25rem; }
      h6 { font-size: 1.1rem; }

      p {
        margin-bottom: var(--space);
        color: var(--text-secondary);
      }

      a {
        color: var(--primary-color);
        text-decoration: none;
        transition: color var(--transition-fast);
      }

      a:hover {
        color: var(--primary-dark);
      }

      /* ==========================================
         LAYOUT UTILITIES
         ========================================== */
      .container-main {
        max-width: 1280px;
        margin: 0 auto;
        padding: 0 var(--space-md);
      }

      .section {
        padding: var(--space-xl) 0;
      }

      .section-header {
        margin-bottom: var(--space-lg);
        text-align: center;
      }

      .section-title {
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: var(--space-sm);
      }

      .section-subtitle {
        font-size: 1.1rem;
        color: var(--text-secondary);
        max-width: 600px;
        margin: 0 auto;
      }

      /* ==========================================
         COMPONENT STYLES
         ========================================== */

      /* Buttons */
      .btn {
        font-family: var(--font-heading);
        font-weight: 500;
        border-radius: var(--radius-full);
        padding: 0.625rem 1.5rem;
        transition: all var(--transition-fast);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        border: 2px solid transparent;
        cursor: pointer;
        text-decoration: none;
      }

      .btn-primary {
        background: var(--primary-gradient);
        border-color: transparent;
        color: white;
        box-shadow: var(--shadow-sm);
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-md);
        background: linear-gradient(135deg, var(--primary-dark) 0%, var(--secondary-color) 100%);
        color: white;
      }

      .btn-primary:active {
        transform: translateY(0);
      }

      .btn-outline-primary {
        background: transparent;
        border-color: var(--primary-color);
        color: var(--primary-color);
      }

      .btn-outline-primary:hover {
        background: var(--primary-color);
        color: white;
        border-color: var(--primary-color);
      }

      .btn-secondary {
        background: var(--gray-100);
        border-color: var(--gray-200);
        color: var(--gray-700);
      }

      .btn-secondary:hover {
        background: var(--gray-200);
        color: var(--gray-800);
      }

      .btn-lg {
        padding: 0.875rem 2rem;
        font-size: 1.1rem;
      }

      .btn-sm {
        padding: 0.375rem 1rem;
        font-size: 0.875rem;
      }

      /* Cards */
      .card {
        background: var(--bg-tertiary);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-lg);
        overflow: hidden;
        transition: all var(--transition-base);
        box-shadow: var(--shadow-sm);
      }

      .card-hover:hover {
        transform: translateY(-4px);
        box-shadow: var(--shadow-lg);
        border-color: var(--primary-200);
      }

      .card-header {
        background: transparent;
        border-bottom: 1px solid var(--border-color);
        padding: var(--space-md);
        font-weight: 600;
      }

      .card-body {
        padding: var(--space-md);
      }

      /* Forms */
      .form-label {
        font-weight: 500;
        color: var(--text-primary);
        margin-bottom: var(--space-sm);
        font-size: 0.875rem;
      }

      .form-control,
      .form-select {
        width: 100%;
        padding: 0.75rem 1rem;
        font-size: 1rem;
        font-family: inherit;
        background: var(--bg-tertiary);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        color: var(--text-primary);
        transition: all var(--transition-fast);
      }

      .form-control:focus,
      .form-select:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
      }

      .form-control::placeholder {
        color: var(--gray-400);
      }

      /* Input Groups with Icons */
      .input-with-icon {
        position: relative;
      }

      .input-with-icon .icon {
        position: absolute;
        left: 1rem;
        top: 50%;
        transform: translateY(-50%);
        color: var(--gray-400);
        pointer-events: none;
      }

      .input-with-icon .form-control {
        padding-left: 3rem;
      }

      /* Badges */
      .badge {
        display: inline-flex;
        align-items: center;
        padding: 0.25rem 0.75rem;
        font-size: 0.75rem;
        font-weight: 600;
        border-radius: var(--radius-full);
        text-transform: uppercase;
        letter-spacing: 0.025em;
      }

      .badge-primary {
        background: var(--primary-100);
        color: var(--primary-700);
      }

      .badge-success {
        background: var(--success-light);
        color: var(--success-color);
      }

      .badge-warning {
        background: var(--warning-light);
        color: var(--warning-color);
      }

      .badge-danger {
        background: var(--danger-light);
        color: var(--danger-color);
      }

      .badge-info {
        background: var(--primary-100);
        color: var(--info-color);
      }

      /* Navbar */
      .navbar {
        background: var(--bg-tertiary) !important;
        box-shadow: var(--shadow-sm);
        border-bottom: 1px solid var(--border-color);
        padding: var(--space-sm) 0;
      }

      .navbar-brand {
        font-family: var(--font-heading);
        font-weight: 700;
        font-size: 1.5rem;
      }

      .nav-link {
        color: var(--text-secondary) !important;
        font-weight: 500;
        padding: var(--space-sm) var(--space) !important;
        border-radius: var(--radius);
        transition: all var(--transition-fast);
      }

      .nav-link:hover,
      .nav-link.active {
        color: var(--primary-color) !important;
        background: var(--primary-50);
      }

      /* Sidebar */
      .sidebar {
        min-height: calc(100vh - 56px);
        background: var(--gray-800);
        padding: var(--space) 0;
      }

      .sidebar .nav-link {
        color: var(--gray-300);
        padding: var(--space-sm) var(--space-md);
        border-radius: var(--radius);
        margin: var(--space-xs) var(--space-sm);
        display: flex;
        align-items: center;
        gap: var(--space-sm);
      }

      .sidebar .nav-link:hover,
      .sidebar .nav-link.active {
        background: rgba(255, 255, 255, 0.1);
        color: white;
      }

      /* Tables */
      .table {
        background: var(--bg-tertiary);
        border-radius: var(--radius-lg);
        overflow: hidden;
      }

      .table thead th {
        background: var(--gray-50);
        border-bottom: 2px solid var(--border-color);
        font-weight: 600;
        text-transform: uppercase;
        font-size: 0.75rem;
        letter-spacing: 0.05em;
        padding: var(--space-md);
      }

      .table tbody td {
        padding: var(--space-md);
        vertical-align: middle;
        border-bottom: 1px solid var(--border-color);
      }

      .table-hover tbody tr:hover {
        background: var(--gray-50);
      }

      /* ==========================================
         PAGE SPECIFIC STYLES
         ========================================== */

      /* Landing Page */
      .hero-section {
        background: var(--primary-gradient);
        color: white;
        padding: var(--space-2xl) 0;
        text-align: center;
      }

      .hero-title {
        font-size: 3rem;
        font-weight: 700;
        margin-bottom: var(--space-md);
      }

      .hero-subtitle {
        font-size: 1.25rem;
        opacity: 0.9;
        max-width: 600px;
        margin: 0 auto var(--space-lg);
      }

      .feature-card {
        background: var(--bg-tertiary);
        border-radius: var(--radius-lg);
        padding: var(--space-lg);
        text-align: center;
        height: 100%;
        border: 1px solid var(--border-color);
      }

      .feature-icon {
        width: 64px;
        height: 64px;
        margin: 0 auto var(--space-md);
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--primary-100);
        border-radius: var(--radius-full);
        color: var(--primary-color);
        font-size: 1.5rem;
      }

      /* Event Cards */
      .event-card {
        background: var(--bg-tertiary);
        border-radius: var(--radius-lg);
        overflow: hidden;
        border: 1px solid var(--border-color);
        transition: all var(--transition-base);
      }

      .event-card:hover {
        transform: translateY(-8px);
        box-shadow: var(--shadow-xl);
        border-color: var(--primary-200);
      }

      .event-card-img {
        height: 200px;
        object-fit: cover;
        width: 100%;
      }

      .event-card-body {
        padding: var(--space-md);
      }

      .price {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--primary-color);
      }

      .price-original {
        text-decoration: line-through;
        color: var(--gray-400);
        font-size: 1rem;
        margin-left: var(--space-sm);
      }

      /* Dashboard Stats */
      .stat-card {
        background: var(--bg-tertiary);
        border-radius: var(--radius-lg);
        padding: var(--space-lg);
        border: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        gap: var(--space-md);
      }

      .stat-icon {
        width: 56px;
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--primary-100);
        border-radius: var(--radius-lg);
        color: var(--primary-color);
        font-size: 1.5rem;
      }

      .stat-value {
        font-size: 2rem;
        font-weight: 700;
        color: var(--text-primary);
        line-height: 1;
      }

      .stat-label {
        font-size: 0.875rem;
        color: var(--text-secondary);
        margin-top: var(--space-xs);
      }

      /* ==========================================
         LOADING STATES
         ========================================== */
      .spinner-container {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--space-2xl);
      }

      /* ==========================================
         ANIMATIONS
         ========================================== */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .fade-in {
        animation: fadeIn var(--transition-base) forwards;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }

      .pulse {
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      /* ==========================================
         RESPONSIVE DESIGN
         ========================================== */
      @media (max-width: 768px) {
        .hero-title {
          font-size: 2rem;
        }

        .section-title {
          font-size: 1.5rem;
        }

        .container-main {
          padding: 0 var(--space);
        }
      }

      /* ==========================================
         UTILITY CLASSES
         ========================================== */
      .text-gradient {
        background: var(--primary-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .shadow-sm { box-shadow: var(--shadow-sm); }
      .shadow { box-shadow: var(--shadow); }
      .shadow-md { box-shadow: var(--shadow-md); }
      .shadow-lg { box-shadow: var(--shadow-lg); }
      .shadow-xl { box-shadow: var(--shadow-xl); }

      .rounded-sm { border-radius: var(--radius-sm); }
      .rounded { border-radius: var(--radius); }
      .rounded-md { border-radius: var(--radius-md); }
      .rounded-lg { border-radius: var(--radius-lg); }
      .rounded-xl { border-radius: var(--radius-xl); }
      .rounded-full { border-radius: var(--radius-full); }

      /* ==========================================
         SCROLLBAR STYLING
         ========================================== */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }

      ::-webkit-scrollbar-track {
        background: var(--gray-100);
      }

      ::-webkit-scrollbar-thumb {
        background: var(--gray-400);
        border-radius: 5px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: var(--gray-500);
      }

      /* Dark mode scrollbar */
      [data-theme="dark"] ::-webkit-scrollbar-track {
        background: var(--gray-800);
      }

      [data-theme="dark"] ::-webkit-scrollbar-thumb {
        background: var(--gray-600);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
